name: Deploy dashboard

on:
  schedule:
    # China Mon-Fri sessions: 05:30 and 06:30 Beijing the next day.
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    # 08:00 Beijing Tue-Sat, after the same preceding China session.
    - cron: '0 0 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Build with per-source exchange-session freshness validation
        run: |
          for attempt in 1 2 3; do
            if python -m pipeline.export; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 300; fi
          done
          exit 1
      - name: Verify generated data before upload
        run: python -m pipeline.export --validate site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record publication failure
        if: failure()
        run: |
          echo "::error::Dashboard build or deployment failed; prior Pages data remains published."
          echo "Dashboard build or deployment failed. Check the failing step and public data date." >> "$GITHUB_STEP_SUMMARY"
